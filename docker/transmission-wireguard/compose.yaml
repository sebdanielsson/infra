---
services:
  wireguard:
    image: ghcr.io/linuxserver/wireguard:version-1.0.20260223-r0
    container_name: wireguard
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      wgnet:
        ipv4_address: 172.100.0.2
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Stockholm
    ports:
      # piecemeal's qBittorrent API for Radarr and Sonarr, which reach it at
      # 172.17.0.1:9092. Bound to the docker bridge only: people use the
      # tailnet name.
      - 172.17.0.1:9092:9092
    volumes:
      - /lib/modules:/lib/modules
      # Rendered into the workspace by pre-deploy.sh before every deploy
      - ./wg0.conf:/config/wg_confs/wg0.conf
    healthcheck:
      test: ["CMD-SHELL", "wg show | grep -q handshake"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    # piecemeal runs in this container's network namespace
    # (network_mode: service:wireguard) and so has no IP of its own: the
    # DockTail service for its web UI and APIs has to be declared here.
    labels:
      - docktail.service.enable=true
      - docktail.service.name=piecemeal
      - docktail.service.description=piecemeal BitTorrent client (via WireGuard)
      - docktail.service.port=9092
      - docktail.service.protocol=http
      - docktail.service.direct=true
      - docktail.service.network=wgnet
      - docktail.service.service-port=443
      - docktail.service.service-protocol=https
    restart: unless-stopped
  # github.com/sebdanielsson/piecemeal: a BitTorrent client on
  # anacrolix/torrent with a qBittorrent-compatible API for Radarr and
  # Sonarr, a web UI, and NAT-PMP port forwarding through the VPN.
  piecemeal:
    image: ghcr.io/sebdanielsson/piecemeal:1.2.0
    container_name: piecemeal
    network_mode: "service:wireguard"
    depends_on:
      wireguard:
        condition: service_healthy
        restart: true
    # The user that owns /chungus/media/downloads, like the *arrs' PUID, so
    # they can move and delete what it downloads.
    user: "1000:1000"
    environment:
      - TZ=Europe/Stockholm
      - PIECEMEAL_ADDR=:9092
      - PIECEMEAL_PUBLIC_URL=https://piecemeal.risk-bee.ts.net
      - PIECEMEAL_DATA_DIR=/data
      # Same mount and path as Radarr's and Sonarr's, so the paths it
      # reports work for them without remote path mappings.
      - PIECEMEAL_DOWNLOAD_DIR=/downloads
      # Where Transmission saved, so the torrents imported from it and new
      # ones sit together.
      - PIECEMEAL_DEFAULT_SAVE_PATH=/downloads/complete
      - PIECEMEAL_WATCH_DIR=/downloads/watch
      # DockTail's tailnet proxy reaches the netns from wgnet's gateway and
      # sends the tailnet client's address in X-Forwarded-For.
      - PIECEMEAL_TRUSTED_PROXIES=172.100.0.1/32
      - PIECEMEAL_NATPMP_GATEWAY=10.2.0.1
      # The tunnel only carries IPv4 (AllowedIPs = 0.0.0.0/0).
      - PIECEMEAL_DISABLE_IPV6=true
      # The local admin, for when Pocket ID is down. The password is
      # PIECEMEAL_ADMIN_PASSWORD in .env.sops, next to its hash.
      - PIECEMEAL_ADMIN_PASSWORD_HASH=${PIECEMEAL_ADMIN_PASSWORD_HASH:-}
      # Pocket ID client "piecemeal", restricted to the admin group, with the
      # callback https://piecemeal.risk-bee.ts.net/api/piecemeal/v1/auth/oidc/callback.
      - PIECEMEAL_OIDC_ISSUER=https://auth.hogwarts.zone
      - PIECEMEAL_OIDC_CLIENT_ID=273c8824-bb8b-4c3c-a370-1389ef1bf24e
      - PIECEMEAL_OIDC_CLIENT_SECRET=${PIECEMEAL_OIDC_CLIENT_SECRET:-}
      - PIECEMEAL_OIDC_NAME=Pocket ID
      - PIECEMEAL_OIDC_ALLOWED_GROUPS=admin
      - PIECEMEAL_OIDC_ADMIN_GROUPS=admin
    volumes:
      # SSD: database and piece completion.
      - piecemeal_data:/data
      - /chungus/media/downloads:/downloads
    stop_grace_period: 30s
    restart: unless-stopped
    deploy:
      replicas: 1

networks:
  wgnet:
    name: wgnet
    ipam:
      config:
        - subnet: 172.100.0.0/24
          ip_range: 172.100.0.0/24
          gateway: 172.100.0.1
    attachable: true

volumes:
  piecemeal_data:
    name: piecemeal_data
