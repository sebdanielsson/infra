---
services:
  wireguard:
    image: ghcr.io/linuxserver/wireguard:version-1.0.20260223-r0
    container_name: wireguard
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      wgnet:
        ipv4_address: 172.100.0.2
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Stockholm
    ports:
      - 9091:9091
    volumes:
      - /lib/modules:/lib/modules
      # Rendered into the workspace by pre-deploy.sh before every deploy
      - ./wg0.conf:/config/wg_confs/wg0.conf
    healthcheck:
      test: ["CMD-SHELL", "wg show | grep -q handshake"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    # Transmission runs in this container's network namespace
    # (network_mode: service:wireguard) and so has no IP of its own — the
    # DockTail service for its web UI has to be declared here.
    labels:
      - docktail.service.enable=true
      - docktail.service.name=transmission
      - docktail.service.description=Transmission web UI (via WireGuard)
      - docktail.service.port=9091
      - docktail.service.protocol=http
      - docktail.service.direct=true
      - docktail.service.network=wgnet
      - docktail.service.service-port=443
      - docktail.service.service-protocol=https
      # piecemeal also lives in this netns: its web UI and both APIs.
      - docktail.service.1.name=piecemeal
      - docktail.service.1.description=piecemeal BitTorrent client (via WireGuard)
      - docktail.service.1.port=9092
      - docktail.service.1.protocol=http
      - docktail.service.1.service-port=443
      - docktail.service.1.service-protocol=https
    restart: unless-stopped
  transmission:
    image: ghcr.io/linuxserver/transmission:4.1.4
    container_name: transmission
    network_mode: "service:wireguard"
    depends_on:
      wireguard:
        condition: service_healthy
        restart: true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Stockholm
      - DOCKER_MODS=jordanpotter/docker-mods:transmission-nat-pmp
      - USER=${TRANSMISSION_USER}
      - PASS=${TRANSMISSION_PASS}
    volumes:
      - transmission_data:/config
      - /chungus/media/downloads:/downloads
    # Shares the wireguard netns, so the RPC/web listener is on localhost
    # here too. USER/PASS turn on RPC basic auth, and an unauthenticated
    # probe then gets 401 forever - so the check must present them.
    # Transmission serves RPC on the same thread that does its disk I/O, so
    # while it downloads onto the chungus HDD pool a request can wait 10-20 s
    # behind a write. 5 s marked it unhealthy whenever it was busy.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -u \"$$USER:$$PASS\" http://localhost:9091/transmission/web/"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # Off while piecemeal is in use: both get the same NAT-PMP port from the
    # VPN and would fight over it in the shared netns. To switch back, set
    # this to 1 and piecemeal's to 0.
    deploy:
      replicas: 0

  # github.com/sebdanielsson/piecemeal: a BitTorrent client on
  # anacrolix/torrent with a qBittorrent-compatible API for Radarr and
  # Sonarr, a web UI, and NAT-PMP port forwarding through the VPN.
  piecemeal:
    image: ghcr.io/sebdanielsson/piecemeal:0.5.0
    container_name: piecemeal
    network_mode: "service:wireguard"
    depends_on:
      wireguard:
        condition: service_healthy
        restart: true
    # The user that owns /chungus/media/downloads, like Transmission's and
    # the *arrs' PUID, so they can move and delete what it downloads.
    user: "1000:1000"
    environment:
      - TZ=Europe/Stockholm
      - PIECEMEAL_ADDR=:9092
      - PIECEMEAL_PUBLIC_URL=https://piecemeal.risk-bee.ts.net
      - PIECEMEAL_DATA_DIR=/data
      # Same mount and path as Radarr's and Sonarr's, so the paths it
      # reports work for them without remote path mappings.
      - PIECEMEAL_DOWNLOAD_DIR=/downloads
      - PIECEMEAL_DEFAULT_SAVE_PATH=/downloads/piecemeal
      - PIECEMEAL_WATCH_DIR=/downloads/piecemeal/watch
      - PIECEMEAL_NATPMP_GATEWAY=10.2.0.1
      # The tunnel only carries IPv4 (AllowedIPs = 0.0.0.0/0).
      - PIECEMEAL_DISABLE_IPV6=true
      # From .env.sops: `docker run --rm -i ghcr.io/sebdanielsson/piecemeal hash-password`.
      - PIECEMEAL_ADMIN_PASSWORD_HASH=${PIECEMEAL_ADMIN_PASSWORD_HASH:-}
      # Pocket ID, once its client exists, with the callback
      # https://piecemeal.risk-bee.ts.net/api/piecemeal/v1/auth/oidc/callback:
      # - PIECEMEAL_OIDC_ISSUER=https://pocket-id.risk-bee.ts.net
      # - PIECEMEAL_OIDC_CLIENT_ID=${PIECEMEAL_OIDC_CLIENT_ID:-}
      # - PIECEMEAL_OIDC_CLIENT_SECRET=${PIECEMEAL_OIDC_CLIENT_SECRET:-}
      # - PIECEMEAL_OIDC_NAME=Pocket ID
    volumes:
      # SSD: database and piece completion.
      - piecemeal_data:/data
      - /chungus/media/downloads:/downloads
    stop_grace_period: 30s
    restart: unless-stopped
    deploy:
      replicas: 1

networks:
  wgnet:
    name: wgnet
    ipam:
      config:
        - subnet: 172.100.0.0/24
          ip_range: 172.100.0.0/24
          gateway: 172.100.0.1
    attachable: true

volumes:
  transmission_data:
    name: transmission_data
    external: true
  piecemeal_data:
    name: piecemeal_data
