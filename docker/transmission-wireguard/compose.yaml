---
services:
  wireguard:
    image: ghcr.io/linuxserver/wireguard:version-1.0.20260223-r0
    container_name: wireguard
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      wgnet:
        ipv4_address: 172.100.0.2
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Stockholm
    ports:
      - 9091:9091
    volumes:
      - /lib/modules:/lib/modules
      # Rendered into the workspace by pre-deploy.sh before every deploy
      - ./wg0.conf:/config/wg_confs/wg0.conf
    healthcheck:
      test: ["CMD-SHELL", "wg show | grep -q handshake"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    # Transmission runs in this container's network namespace
    # (network_mode: service:wireguard) and so has no IP of its own — the
    # DockTail service for its web UI has to be declared here.
    labels:
      - docktail.service.enable=true
      - docktail.service.name=transmission
      - docktail.service.description=Transmission web UI (via WireGuard)
      - docktail.service.port=9091
      - docktail.service.protocol=http
      - docktail.service.direct=true
      - docktail.service.network=wgnet
      - docktail.service.service-port=443
      - docktail.service.service-protocol=https
      # anacrolix also lives in this netns; its status page and /add.
      - docktail.service.1.name=anacrolix
      - docktail.service.1.description=anacrolix test client (via WireGuard)
      - docktail.service.1.port=9092
      - docktail.service.1.protocol=http
      - docktail.service.1.service-port=443
      - docktail.service.1.service-protocol=https
    restart: unless-stopped
  transmission:
    image: ghcr.io/linuxserver/transmission:4.1.4
    container_name: transmission
    network_mode: "service:wireguard"
    depends_on:
      wireguard:
        condition: service_healthy
        restart: true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Stockholm
      - DOCKER_MODS=jordanpotter/docker-mods:transmission-nat-pmp
      - USER=${TRANSMISSION_USER}
      - PASS=${TRANSMISSION_PASS}
    volumes:
      - transmission_data:/config
      - /chungus/media/downloads:/downloads
    # Shares the wireguard netns, so the RPC/web listener is on localhost
    # here too. USER/PASS turn on RPC basic auth, and an unauthenticated
    # probe then gets 401 forever - so the check must present them.
    # Transmission serves RPC on the same thread that does its disk I/O, so
    # while it downloads onto the chungus HDD pool a request can wait 10-20 s
    # behind a write. 5 s marked it unhealthy whenever it was busy.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -u \"$$USER:$$PASS\" http://localhost:9091/transmission/web/"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # Off while anacrolix is being tried out: both get the same NAT-PMP port
    # from the VPN and would fight over it in the shared netns. To switch
    # back, set this to 1 and anacrolix's to 0.
    deploy:
      replicas: 0

  # Headless test client on github.com/anacrolix/torrent; source and docs in
  # ./anacrolix. Stock Go image, built at container start from the synced
  # workspace (cached in anacrolix_cache), so there is no image to publish.
  anacrolix:
    image: golang:1.27.4-alpine
    container_name: anacrolix
    network_mode: "service:wireguard"
    depends_on:
      wireguard:
        condition: service_healthy
        restart: true
    working_dir: /src
    entrypoint: ["/bin/sh", "-c", "mkdir -p /cache/bin && go build -trimpath -o /cache/bin/anacrolix . && exec /cache/bin/anacrolix"]
    environment:
      - TZ=Europe/Stockholm
      # Written by pre-deploy.sh; changes with the source, which makes
      # compose recreate this container after a code change.
      - SRC_HASH=${ANACROLIX_SRC_HASH:-}
      - CGO_ENABLED=0
      - GOTOOLCHAIN=local
      - GOFLAGS=-mod=readonly
      - GOCACHE=/cache/go-build
      - GOMODCACHE=/cache/mod
      - NATPMP_GATEWAY=10.2.0.1
      - HTTP_ADDR=:9092
      # Plain pwrite instead of mmap. Through mmap, every 16 KiB chunk landed
      # as page writes into 128K records on the chungus RAID-Z1: ~13x write
      # amplification and ~530 KiB/s. pwrite lets ZFS merge chunks per txg.
      - DISABLE_MMAP=true
      - HTTP_USER=${TRANSMISSION_USER}
      - HTTP_PASS=${TRANSMISSION_PASS}
    volumes:
      - ./anacrolix:/src:ro
      - anacrolix_cache:/cache
      # SSD: piece completion DB and the saved .torrent/.magnet files
      - anacrolix_data:/data
      # Same pool as Transmission's downloads, so the comparison is fair:
      # files/ for payloads, watch/ for dropping in .torrent/.magnet files.
      - /chungus/media/downloads/anacrolix:/downloads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9092/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first start compiles the module; later starts hit the cache.
      start_period: 10m
    stop_grace_period: 30s
    restart: unless-stopped
    deploy:
      replicas: 1

networks:
  wgnet:
    name: wgnet
    ipam:
      config:
        - subnet: 172.100.0.0/24
          ip_range: 172.100.0.0/24
          gateway: 172.100.0.1
    attachable: true

volumes:
  transmission_data:
    name: transmission_data
    external: true
  anacrolix_data:
    name: anacrolix_data
  anacrolix_cache:
    name: anacrolix_cache
