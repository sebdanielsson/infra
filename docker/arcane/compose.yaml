---
services:
  app:
    container_name: arcane
    image: ghcr.io/getarcaneapp/manager:v3.2.0
    networks:
      - arcane
    ports:
      - 3552:3552
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane_data:/app/data
      - /docker:/docker
    environment:
      - TZ=Europe/Stockholm
      # Run the app worker as root instead of upstream's nonroot default:
      # with the docker socket mounted the worker is root-equivalent anyway,
      # and this lets git syncs, pre-deploy hook runners (root, CapDrop ALL)
      # and the worker share workspace files without uid gymnastics.
      - PUID=0
      - PGID=0
      # v3 requires the ARCANE_ prefix on every Arcane setting; unprefixed
      # names abort startup. JWT_SECRET is retired (Arcane manages its own
      # signing key).
      - ARCANE_APP_URL=https://arcane.hogwarts.zone
      - ARCANE_PROJECTS_DIRECTORY=/docker
      - ARCANE_TRUSTED_PROXIES=172.16.0.0/12
      - ARCANE_ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ARCANE_OIDC_ENABLED=true
      - ARCANE_OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - ARCANE_OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - ARCANE_OIDC_ISSUER_URL=https://auth.hogwarts.zone
      - ARCANE_OIDC_SCOPES=openid email profile groups
      - ARCANE_OIDC_GROUPS_CLAIM=groups
      - 'ARCANE_OIDC_ROLE_MAPPINGS=[{"claimValue":"admin","roleId":"role_admin"}]'
      # Runner for the GitOps pre-deploy hooks (sops decryption). Leave the
      # runner image empty on each sync so this default applies; Renovate
      # bumps it via the custom manager in .github/renovate.json.
      - ARCANE_LIFECYCLE_DEFAULT_RUNNER_IMAGE=ghcr.io/getsops/sops:v3.13.3-alpine
    # Use host cgroup namespace so Arcane can detect its own container
    cgroup: host
    healthcheck:
      test: ['CMD', './arcane', 'health', '--timeout', '2s']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    labels:
      - docktail.service.enable=true
      - docktail.service.name=arcane
      - docktail.service.description=Arcane Docker manager
      - docktail.service.port=3552
      - docktail.service.protocol=http
      - docktail.service.direct=true
      - docktail.service.network=arcane
      - docktail.service.service-port=443
      - docktail.service.service-protocol=https
    restart: unless-stopped

networks:
  arcane:
    name: arcane

volumes:
  arcane_data:
    name: arcane_data
    external: true
