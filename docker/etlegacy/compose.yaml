---
services:
  etlegacy:
    container_name: etlegacy
    image: sebdanielsson/etlegacy:2.86.0
    command: +set fs_game nitmod +set fs_homepath /etlegacy +set g_protect 1 +exec nitmod.cfg
    networks:
      - etlegacy
    ports:
      - "27960:27960/udp"
    volumes:
      - /docker/data/etlegacy/etlegacy/legacy/omni-bot/et/user/omni-bot.cfg:/etlegacy/legacy/omni-bot/et/user/omni-bot.cfg
      - /docker/data/etlegacy/etlegacy/legacy/omni-bot/et/nav:/etlegacy/legacy/omni-bot/et/nav
      - /docker/data/etlegacy/etlegacy/nitmod:/etlegacy/nitmod
      - /docker/data/etlegacy/etlegacy/etmain:/etlegacy/etmain
    # A Quake3-engine dedicated server speaks only its own UDP protocol and
    # the image ships no curl/wget/nc, so probe the kernel instead: 27960
    # appears as hex 6D38 in /proc/net/udp once the server has bound it.
    healthcheck:
      test: ["CMD-SHELL", "grep -qi ':6D38' /proc/net/udp"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  etlegacy-mirror:
    container_name: etlegacy-mirror
    image: nginx:1.31.6-alpine
    networks:
      - etlegacy
    volumes:
      - /docker/data/etlegacy/etlegacy/etmain:/usr/share/nginx/html/etmain:ro
      - /docker/data/etlegacy/etlegacy/nitmod/nitmod_2.3.4_b4.pk3:/usr/share/nginx/html/nitmod/nitmod_2.3.4_b4.pk3:ro
    labels:
      - docktail.service.enable=true
      - docktail.service.name=etlegacy-mirror
      - docktail.service.description=ET Legacy pk3 download mirror
      - docktail.service.port=80
      - docktail.service.protocol=http
      - docktail.service.direct=true
      - docktail.service.network=etlegacy
      - docktail.service.service-port=443
      - docktail.service.service-protocol=https
    # Static pk3 mirror: serving its index is the whole job.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
networks:
  etlegacy:
    name: etlegacy
