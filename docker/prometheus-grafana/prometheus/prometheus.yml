---
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # readsb's own exporter, enabled by PROMETHEUS_ENABLE in the ultrafeeder
  # stack on flightradar. Port 9273 is only served by the :telegraf image
  # variant, which we don't run — 9274 is readsb's native endpoint.
  - job_name: "readsb"
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["flightradar.risk-bee.ts.net:9274"]
        labels:
          site: uppsala

  # Host metrics for the receiver Pi: SoC temperature, load, SD card, network.
  - job_name: "node"
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ["flightradar.risk-bee.ts.net:9100"]
        labels:
          site: uppsala
          host: flightradar
