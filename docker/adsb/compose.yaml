---
# ADS-B observability stack for the flightradar receiver (Raspberry Pi).
#
# dump1090-fa keeps ownership of the RTL-SDR dongle and keeps feeding
# Flightradar24 — nothing here touches the radio. Ultrafeeder runs readsb in
# net-only mode, ingesting dump1090-fa's Beast output on the host, and adds
# the tar1090 map, graphs1090 and a Prometheus endpoint on top of it.
#
# Deployed by Ansible (ansible/tasks/adsb-stack.yml), not Arcane: Arcane only
# manages hogsmeade.
services:
  ultrafeeder:
    container_name: ultrafeeder
    image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder:latest-build-953
    networks:
      - adsb
    ports:
      - 8504:80 # tar1090 / graphs1090 web UI
      - 9273:9273 # Prometheus endpoint (telegraf-shaped)
      - 9274:9274 # Prometheus endpoint (readsb)
    # readsb connects to dump1090-fa running on the host, not in a container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Europe/Stockholm
      - LOGLEVEL=error
      # Decoder: no SDR here, only a Beast feed from the host's dump1090-fa.
      - READSB_NET_ONLY=true
      - ULTRAFEEDER_CONFIG=adsb,host.docker.internal,30005,beast_in
      # Receiver position — without it there are no range or distance stats.
      - READSB_LAT=${ADSB_LAT}
      - READSB_LON=${ADSB_LON}
      - READSB_ALT=${ADSB_ALT_M}m
      - READSB_RX_LOCATION_ACCURACY=2
      - READSB_STATS_RANGE=true
      - READSB_ENABLE_HEATMAP=true
      # Traces/heatmap live on the Pi's SD card; 14 days keeps the write load
      # and the footprint modest. Long-term history lives in the flight log
      # SQLite database on hogsmeade instead.
      - MAX_GLOBE_HISTORY=14
      # Adds registration, ICAO type, description and operator to
      # aircraft.json (~50 MB RAM). The flight logger depends on this.
      - TAR1090_ENABLE_AC_DB=true
      - TAR1090_PAGETITLE=Uppsala ADS-B
      - TAR1090_PLANECOUNTINTITLE=true
      - TAR1090_MESSAGERATEINTITLE=true
      - TAR1090_SITESHOW=true
      - TAR1090_RANGE_OUTLINE_COLORED_BY_ALTITUDE=true
      - TAR1090_RANGE_OUTLINE_WIDTH=2.0
      - TAR1090_RANGERINGSDISTANCES=50,100,150,200,250
      - TAR1090_RANGERINGSCOLORS='#3987e5','#3987e5','#3987e5','#3987e5','#3987e5'
      - TAR1090_USEROUTEAPI=true
      - TAR1090_FLIGHTAWARELINKS=true
      - GRAPHS1090_DARKMODE=true
      - PROMETHEUS_ENABLE=true
    volumes:
      - globe_history:/var/globe_history
      - graphs1090:/var/lib/collectd
      - /proc/diskstats:/proc/diskstats:ro
    tmpfs:
      - /run:exec,size=256M
    labels:
      - docktail.service.enable=true
      - docktail.service.name=tar1090
      - docktail.service.description=Live ADS-B map and receiver graphs
      - docktail.service.port=80
      - docktail.service.protocol=http
      - docktail.service.direct=true
      - docktail.service.network=adsb
      - docktail.service.service-port=443
      - docktail.service.service-protocol=https
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 600s
      timeout: 60s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # fr24feed's status page runs on the host, not in a container, so DockTail
  # cannot see it — and DockTail prunes any tailnet service it doesn't manage.
  # This forwarder gives it a container to attach https://fr24.risk-bee.ts.net
  # to. It stays reachable at http://flightradar:8754 either way.
  fr24-proxy:
    container_name: fr24-proxy
    image: alpine/socat:1.8.1.3
    networks:
      - adsb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["TCP-LISTEN:8754,fork,reuseaddr", "TCP:host.docker.internal:8754"]
    labels:
      - docktail.service.enable=true
      - docktail.service.name=fr24
      - docktail.service.description=Flightradar24 feeder status
      - docktail.service.port=8754
      - docktail.service.protocol=http
      - docktail.service.direct=true
      - docktail.service.network=adsb
      - docktail.service.service-port=443
      - docktail.service.service-protocol=https
    restart: unless-stopped

  # Host metrics for the Pi (CPU temperature, load, SD card, network) so the
  # receiver dashboard can correlate reception with the machine's health.
  node-exporter:
    container_name: node-exporter
    image: quay.io/prometheus/node-exporter:v1.12.1
    network_mode: host
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|run/docker/.+)($$|/)"
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

networks:
  adsb:
    name: adsb

volumes:
  globe_history:
    name: adsb_globe_history

  graphs1090:
    name: adsb_graphs1090
